<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .cloud-pulse {
        animation: pulseCloud 4s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: streamDash 20s linear infinite;
      }
      .stream-line-rev {
        stroke-dasharray: 6 10;
        animation: streamDashRev 16s linear infinite;
      }
      .pill-badge {
        transition: transform 0.3s ease;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, -30px) scale(1.15); }
        100% { transform: translate(-40px, 40px) scale(0.95); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-70px, 40px) scale(1.2); }
        100% { transform: translate(50px, -20px) scale(0.9); }
      }
      @keyframes pulseCloud {
        0% { opacity: 0.6; transform: scale(0.98); }
        100% { opacity: 0.9; transform: scale(1.02); }
      }
      @keyframes streamDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes streamDashRev {
        to { stroke-dashoffset: 200; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in Background -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="200" cy="120" r="130" fill="url(#glowGrad1)"/>
    <circle class="orb-2" cx="1020" cy="280" r="160" fill="url(#glowGrad2)"/>
  </g>

  <!-- Dynamic Network Stream Lines in Background -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 80 Q 300 20, 600 90 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="stream-line-rev" d="M -50 360 Q 400 390, 750 320 T 1250 370" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path class="stream-line" d="M 100 0 Q 350 250, 600 180 T 1100 420" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Animated Graphic Icon in Background/Accent -->
  <g class="cloud-pulse" transform="translate(600, 70)" text-anchor="middle">
    <!-- Cloud Path -->
    <path d="M -45 10 C -45 -10, -25 -25, 0 -25 C 22 -25, 40 -12, 45 8 C 58 10, 68 20, 68 34 C 68 48, 56 60, 42 60 L -42 60 C -58 60, -70 48, -70 34 C -70 20, -58 11, -45 10 Z"
          fill="none" stroke="url(#titleGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- Upload Arrow inside Cloud -->
    <path d="M 0 45 L 0 15 M -12 27 L 0 15 L 12 27" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Content: Header, Title, Subtitle (Clear, crisp, unobstructed) -->
  <!-- Category Pill -->
  <g transform="translate(600, 155)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text text-anchor="middle" y="5" fill="#38bdf8" class="tag-text">☁️ CLOUD HOSTING &amp; PAAS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="215" text-anchor="middle" fill="url(#titleGrad)" class="title-text" font-size="44">
    Awesome Cloud Web Hosting &amp; Portals
  </text>

  <!-- Subtitle -->
  <text x="600" y="258" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="18">
    Curated Hub of Scalable SaaS Platforms, Self-Hosted PaaS &amp; Modern Control Panels
  </text>

  <!-- Dynamic Feature Badges / Pills in Foreground -->
  <g transform="translate(180, 315)">
    <!-- Pill 1: Static Sites -->
    <g class="pill-badge">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="5" fill="#38bdf8"/>
      <text x="36" y="26" fill="#e2e8f0" class="tag-text">Static Site Edge</text>
    </g>

    <!-- Pill 2: Managed WordPress -->
    <g class="pill-badge" transform="translate(205, 0)">
      <rect x="0" y="0" width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="5" fill="#818cf8"/>
      <text x="36" y="26" fill="#e2e8f0" class="tag-text">Managed WordPress</text>
    </g>

    <!-- Pill 3: Self-Hosted PaaS -->
    <g class="pill-badge" transform="translate(425, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="5" fill="#c084fc"/>
      <text x="36" y="26" fill="#e2e8f0" class="tag-text">Self-Hosted PaaS</text>
    </g>

    <!-- Pill 4: Web Control Panels -->
    <g class="pill-badge" transform="translate(635, 0)">
      <rect x="0" y="0" width="205" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="5" fill="#34d399"/>
      <text x="36" y="26" fill="#e2e8f0" class="tag-text">Modern Control Panels</text>
    </g>
  </g>
</svg>
